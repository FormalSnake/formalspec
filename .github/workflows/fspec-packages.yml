name: fspec packages

on:
  push:
    branches: [main]
    paths: ["examples/kyan/fspec.lock", "examples/kyan/patches/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.pkg }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: clipssh, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: fast, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: fetch, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: formalmusic, platform: x86_64-linux, runner: ubuntu-24.04, deps: "libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libasound2-dev libdbus-1-dev libssl-dev" }
          - { pkg: gopls, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: kopuzd, platform: x86_64-linux, runner: ubuntu-24.04, deps: "libasound2-dev libdbus-1-dev libssl-dev" }
          - { pkg: librepods, platform: x86_64-linux, runner: ubuntu-24.04, deps: "qt6-base-dev qt6-declarative-dev qt6-connectivity-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libssl-dev libpulse-dev" }
          - { pkg: lumen, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: meshtop, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: messages, platform: x86_64-linux, runner: ubuntu-24.04, deps: "libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libasound2-dev libdbus-1-dev libssl-dev" }
          - { pkg: nil, platform: x86_64-linux, runner: ubuntu-24.04, deps: "nix-bin" }
          - { pkg: wl-clip-persist, platform: x86_64-linux, runner: ubuntu-24.04 }
          - { pkg: wl-gammarelay-rs, platform: x86_64-linux, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1
      - name: Install build dependencies
        if: matrix.deps
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install ${{ matrix.deps }}
          else
            sudo apt-get update -q && sudo apt-get install -yq ${{ matrix.deps }}
          fi
      - name: Install fspec
        run: cargo install --locked --git https://github.com/FormalStudio/formalspec fspec
      - name: Build
        run: fspec --spec examples/kyan/spec.star build --pkg ${{ matrix.pkg }} --platform ${{ matrix.platform }} --out out
      - name: Push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "$TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd out
          oras push "ghcr.io/$owner/fspec-cache/${{ matrix.pkg }}:$(cat tag)" \
            "${{ matrix.pkg }}-${{ matrix.platform }}.tar.zst:application/vnd.fspec.package.v1.tar+zstd"
