[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/FormalSnake/formalspec"

[workspace.dependencies]
allocative = "0.3.6"
age = { version = "0.12.1", features = ["armor"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
notify = "8.2.0"
plist = "1.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
similar = "3.2.0"
starlark = "0.14.2"
tempfile = "3"
toml = "1.1.8"
ureq = "3.4.2"
fspec-core = { path = "crates/fspec-core" }
fspec-eval = { path = "crates/fspec-eval" }
fspec-files = { path = "crates/fspec-files" }
